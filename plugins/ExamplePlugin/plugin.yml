name: ExamplePlugin
version: "1.1.0"
main: pocketmine\example\Main
api: ["5.0.0"]
author: PocketMine-Rust Team
description: "Plugin de ejemplo: eventos de jugador, comandos, permisos y configuración."
website: "https://github.com/pmmp/PocketMine-MP"

commands:
  hello:
    description: "Saluda al remitente."
    usage: "/hello"
    aliases: ["hi"]
    permission: exampleplugin.command.hello

permissions:
  exampleplugin.command.hello:
    description: "Permite usar /hello."
    default: true
