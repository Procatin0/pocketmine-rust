name: ScoreboardDemo
version: "1.0.0"
main: scoreboarddemo\Main
api: ["5.0.0"]
author: PocketMine-Rust Team
description: "Ejemplo del scoreboard: /sb muestra, actualiza y limpia objetivos y líneas."
website: "https://github.com/pmmp/PocketMine-MP"

commands:
  sb:
    description: "Gestiona tu scoreboard de ejemplo."
    usage: "/sb [show|update <score> <text...>|clear]"
    aliases: ["scoreboard-demo"]
    permission: scoreboarddemo.command

permissions:
  scoreboarddemo.command:
    description: "Permite usar los comandos de ScoreboardDemo."
    default: op
