# JavaBridge: cliente Minecraft Java Edition (TCP) -> mundo Bedrock.
#
# El listener lo abre este plugin con streams de PHP (no bloqueantes) y lo
# atiende una vez por tick del servidor.

# Interfaz y puerto TCP donde escuchan los clientes de Java.
# No debe coincidir con los puertos de Bedrock (19132/19133).
host: "0.0.0.0"
port: 25565

# MOTD de la lista de servidores de Minecraft Java.
motd: "PocketMine-Rust (Java 1.12.2 -> Bedrock)"

# Pedir el listener al habilitar el plugin.
enabled: true

# Radio de chunks enviados al cliente Java (columnas = (2r+1)^2).
# Cada columna se pide al servidor con una host call (`world.get_chunk`), así
# que el coste crece con el área: 2 = 25 columnas, 6 = 169, 10 = 441 (lo que
# usa el servidor Bedrock por defecto). El envío va por turnos con un
# presupuesto de 12 ms por tick, así que el cliente ve el mundo crecer.
view-distance: 6

# Valores que se anuncian al cliente Java.
gamemode: 0
difficulty: 2
level-type: "flat"

# Versiones que entiende el traductor (informativo; el puente negocia por
# número de protocolo).
# 340 = 1.12.2 ; 769/770/773/774/775 = 1.21.4/1.21.5/1.21.9/1.21.11/26.1
java-versions: "1.12.2, 1.21.4, 1.21.5, 1.21.9, 1.21.11, 26.1"
