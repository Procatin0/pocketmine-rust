name: TestKit
version: "1.0.0"
main: testkit\Main
api: ["5.0.0"]
author: PocketMine-Rust Team
description: "Kit de pruebas de la API: eventos, comandos, permisos, scheduler y host calls."
website: "https://github.com/pmmp/PocketMine-MP"

softdepend: ["ExamplePlugin"]

commands:
  testkit:
    description: "Muestra información del runtime y del estado del servidor."
    usage: "/testkit"
    aliases: ["tk"]
    permission: testkit.command
  pos:
    description: "Muestra la posición y el mundo del jugador."
    usage: "/pos"
    permission: testkit.command
  block:
    description: "Muestra el bloque situado bajo el jugador."
    usage: "/block"
    permission: testkit.command
  tps:
    description: "Muestra los ticks por segundo del servidor."
    usage: "/tps"
    permission: testkit.command

permissions:
  testkit.command:
    description: "Permite usar los comandos de TestKit."
    default: op
