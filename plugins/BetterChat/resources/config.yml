# ============================
# BetterChat Configuration
# ============================

# DO NOT CHANGE THIS! Used internally to detect config updates.
config-version: 2

# Language file to use (from lang/ folder, e.g. "en", "es").
language: "en"

# ============================
# Prefix / Suffix (only used when RankSystem is NOT present)
# ============================
# Prefix/suffix resolution order:
#   1. Custom prefix set via /betterchat setprefix
#   2. OP prefix (if player is OP)
#   3. Default prefix from below

# RankSystem integration (requires IvanCraft623/RankSystem plugin).
ranksystem:
  enabled: true

# Prefix for OP players.
op-prefix: "&c[OP] "

# Prefix for regular players.
default-prefix: ""

# Suffix for OP players.
op-suffix: ""

# Suffix for regular players.
default-suffix: ""

# ============================
# Color Codes
# ============================
color-codes:
  # Enable & color code conversion in chat.
  enabled: true
  # Permission required to use & color codes.
  permission: "betterchat.color"

# ============================
# Anti-Spam
# ============================
anti-spam:
  enabled: true
  # Bypass permission.
  bypass-permission: "betterchat.bypass.spam"
  # Cooldown between messages in seconds.
  cooldown: 3
  # Block duplicate messages.
  block-duplicates: true
  # Max message length (0 = unlimited).
  max-length: 100
  # Caps lock percentage threshold (0 = disabled).
  caps-percentage: 70
  # Minimum message length to check caps (short messages exempt).
  caps-min-length: 4

# ============================
# Anti-Swear / Word Filter
# ============================
word-filter:
  enabled: true
  # Bypass permission.
  bypass-permission: "betterchat.bypass.filter"
  # List of blocked words (case-insensitive).
  blocked-words:
    - "badword1"
    - "badword2"
  # Replacement text for blocked words.
  replacement: "***"

# ============================
# Anti-Links
# ============================
anti-links:
  enabled: true
  # Bypass permission.
  bypass-permission: "betterchat.bypass.links"
  # Action: "block" cancels the message, "filter" replaces links with replacement text.
  action: "filter"
  # Replacement text when action is "filter".
  replacement: "[LINK]"
  # Whitelisted domains (links containing these will NOT be blocked).
  whitelist:
    - "minecraft.net"
    - "mojang.com"
    - "youtube.com"
    - "discord.gg"

# ============================
# Mentions
# ============================
mentions:
  enabled: true

# ============================
# Join / Quit Messages
# ============================
join-quit:
  enabled: true
  # Set to true to hide default join/quit messages and use custom ones below.
  custom: true

# ============================
# Mute System
# ============================
mute:
  # Persist muted players to disk (saved in data/muted_players.yml).
  persist: true

# ============================
# Vote Mute
# ============================
vote-mute:
  enabled: true
  # Minimum online players required to start a vote.
  min-online-players: 4
  # Vote duration in seconds.
  vote-duration: 30
  # Percentage of "yes" votes required to pass (0-100).
  yes-percentage: 60
  # Mute duration in seconds when vote passes (0 = permanent).
  mute-duration: 300
  # Cooldown between votes per player in seconds.
  cooldown: 60
  # Players with this permission cannot be vote-muted.
  bypass-permission: "betterchat.votemute.bypass"

# ============================
# Command Cooldowns
# ============================
command-cooldowns:
  enabled: true
  # Bypass permission.
  bypass-permission: "betterchat.bypass.spam"
  # Cooldown in seconds per command.
  commands: []
  #  - command: "home"
  #    cooldown: 10
  #  - command: "tpa"
  #    cooldown: 30

# ============================
# Minigames
# ============================
minigames:
  enabled: true
  # Auto-start interval in seconds (0 = disabled, manual only).
  auto-start-interval: 300
  # Time limit per minigame in seconds.
  time-limit: 30
  # Console commands executed when a player wins.
  # Use {winner} for the winner's name.
  reward-commands:
    - "say {winner} won the chat minigame!"
    - "give {winner} diamond 1"

  # Trivia minigame - first to type the correct answer wins.
  # Questions are loaded from minigames.yml.
  trivia:
    enabled: true

  # Unscramble minigame - first to unscramble the word wins.
  # Words are loaded from minigames.yml.
  unscramble:
    enabled: true

  # Math minigame - first to solve the math problem wins.
  math:
    enabled: true
    # Range for random numbers.
    min-number: 1
    max-number: 50
    # Available operations: +, -, *
    operations: ["+", "-"]

# ============================
# Auto-Broadcast
# ============================
broadcast:
  enabled: true
  # Interval between messages in seconds.
  interval: 120
  # Prefix for broadcast messages.
  prefix: "&8[&eBroadcast&8] &r"
  # Messages are loaded from broadcasts.yml.

# ============================
# Chat Groups
# ============================
groups:
  enabled: true
  # Maximum groups a single player can own.
  max-groups-per-player: 3
  # Maximum members per group (including owner).
  max-members-per-group: 20
  # Invite expiration time in seconds.
  invite-timeout: 60
  # Group name length limits.
  min-name-length: 3
  max-name-length: 16
  # Regex pattern for valid group names.
  name-pattern: "^[a-zA-Z0-9_-]+$"
