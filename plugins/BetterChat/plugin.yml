name: BetterChat
version: "1.0.0"
main: BetterChat\Main
src-namespace-prefix: BetterChat
api: [5.0.0]
author: Matic
description: Advanced chat management plugin for PocketMine-MP

commands:
  bchat:
    description: "BetterChat admin commands"
    usage: "/bchat <reload|mute|unmute|setprefix|setsuffix|minigame>"
    permission: betterchat.admin
  group:
    description: "Chat group management"
    usage: "/group <create|delete|invite|accept|deny|leave|kick|chat|list|info>"
    permission: betterchat.group.use
  votemute:
    description: "Vote to mute a player"
    usage: "/votemute <player> [yes|no]"
    permission: betterchat.votemute

permissions:
  betterchat.admin:
    description: "Allows use of all BetterChat admin commands"
    default: op
  betterchat.command.reload:
    description: "Reload BetterChat config"
    default: op
  betterchat.command.mute:
    description: "Mute a player"
    default: op
  betterchat.command.unmute:
    description: "Unmute a player"
    default: op
  betterchat.command.setprefix:
    description: "Set a player's chat prefix"
    default: op
  betterchat.command.setsuffix:
    description: "Set a player's chat suffix"
    default: op
  betterchat.command.minigame:
    description: "Manage chat minigames"
    default: op
  betterchat.color:
    description: "Allow use of & color codes in chat"
    default: op
  betterchat.bypass.spam:
    description: "Bypass anti-spam filters"
    default: op
  betterchat.bypass.filter:
    description: "Bypass word filter"
    default: op
  betterchat.bypass.links:
    description: "Bypass anti-links filter"
    default: op
  betterchat.mention:
    description: "Allow being mentioned in chat"
    default: true
  betterchat.group.use:
    description: "Use basic group commands"
    default: true
  betterchat.group.create:
    description: "Create chat groups"
    default: true
  betterchat.group.admin:
    description: "Admin group features (official groups, bypass limits, manage any group)"
    default: op
  betterchat.votemute:
    description: "Vote to mute a toxic player"
    default: true
  betterchat.votemute.bypass:
    description: "Cannot be vote-muted"
    default: op
