[workspace]
resolver = "2"
members = [
    "crates/bedrock-protocol",
    "crates/nethernet-rs",
    "crates/raklib-rs",
    "crates/bedrock-world",
    "crates/server-core",
    "crates/php-plugin-bridge",
    "crates/java-protocol",
    "crates/java-bridge",
]

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
bytes = "1.6"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
parking_lot = "0.12"
rayon = "1.10"

# Optimize heavy dependencies even in dev (debug) builds so chunk compression
# (flate2), rayon thread pools, and hashing don't bottleneck the 20 TPS loop.
[profile.dev.package."*"]
opt-level = 3

