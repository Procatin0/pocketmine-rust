[package]
name = "server-core"
version = "0.1.0"
edition = "2021"

[dependencies]
bedrock-protocol = { path = "../bedrock-protocol" }
nethernet-rs = { path = "../nethernet-rs" }
raklib-rs = { path = "../raklib-rs" }
bedrock-world = { path = "../bedrock-world" }
php-plugin-bridge = { path = "../php-plugin-bridge" }
# Native Java Edition bridge: the Tokio listener formerly owned by the
# `plugins/JavaBridge` PHP plugin now lives in `java-bridge` (`JavaServer`)
# and is started from `main.rs`. `java-protocol` carries the shared
# Protocol/NBT/ModernProfile tables the bridge frames against.
java-bridge = { path = "../java-bridge" }
java-protocol = { path = "../java-protocol" }
tokio = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
sha2 = "0.11"
rayon = { workspace = true }
